<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <!-- Градиентный фон -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    
    <!-- Свечение для текста -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="800" height="200" fill="url(#bg)" rx="15" stroke="#30363d" stroke-width="2"/>

  <!-- Падающий двоичный код на фоне (матрица) -->
  <g fill="#238636" opacity="0.15" font-family="monospace" font-size="14">
    <text x="50" y="30">01001</text>
    <text x="50" y="60">11010</text>
    <text x="50" y="90">00111</text>
    <text x="50" y="120">10101</text>
    <text x="50" y="150">01100</text>
    
    <text x="150" y="40">10010</text>
    <text x="150" y="80">01101</text>
    <text x="150" y="120">11001</text>
    <text x="150" y="160">00110</text>
    
    <text x="650" y="50">10110</text>
    <text x="650" y="90">01001</text>
    <text x="650" y="130">11100</text>
    <text x="650" y="170">00011</text>
    
    <text x="720" y="30">11010</text>
    <text x="720" y="70">00101</text>
    <text x="720" y="110">10011</text>
    <text x="720" y="150">01101</text>
  </g>

  <!-- Главный текст -->
  <g filter="url(#glow)">
    <text x="400" y="100" font-family="monospace" font-size="48" font-weight="bold" fill="#58a6ff" text-anchor="middle" letter-spacing="4">
      QezOS
    </text>
  </g>
  
  <!-- Подзаголовок -->
  <text x="400" y="140" font-family="monospace" font-size="16" fill="#8b949e" text-anchor="middle" letter-spacing="2">
    SYSTEM INITIALIZED
  </text>

  <!-- Мигающий курсор под текстом -->
  <g>
    <rect x="360" y="155" width="10" height="15" fill="#3fb950">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
    <rect x="375" y="155" width="10" height="15" fill="#3fb950">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" />
    </rect>
    <rect x="390" y="155" width="10" height="15" fill="#3fb950">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
    <rect x="405" y="155" width="10" height="15" fill="#3fb950">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" />
    </rect>
    <rect x="420" y="155" width="10" height="15" fill="#3fb950">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
